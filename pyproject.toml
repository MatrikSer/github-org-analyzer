[project]
name = "github-org-analyzer"
version = "0.1.0"
description = ""
authors = [
    {name = "MatrikSer",email = "sergeev45223@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests (>=2.32.5,<3.0.0)"
]

[tool.poetry.scripts]
github-org-analyzer = "src.github_org_analyzer.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)",
    "isort (>=6.1.0,<7.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.18.2,<2.0.0)"
]

[tool.poetry]
packages = [
    { include = "github_org_analyzer", from = "src" }
]
